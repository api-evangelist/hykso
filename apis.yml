name: Hykso
description: Hykso, Inc. is the company behind FightCamp, an at-home boxing and kickboxing
  training system that pairs a free-standing bag, quick-wrap gloves, and wireless motion-tracking
  punch trackers with an on-demand library of trainer-led workouts. The Hykso punch
  trackers began as standalone wearable sensors that measure punch count, speed, and
  output for boxers and gyms, and now power FightCamp's real-time performance stats
  and workout scoring. This profile is a company stub in the API Evangelist network;
  Hykso/FightCamp is a direct-to-consumer connected-fitness brand and does not publish
  a public developer API.
